# Render Blueprint for ORION Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: orion-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ORION_AGENT_PROVIDER
        value: local
      - key: ORION_CORS_ORIGINS
        value: "https://orion-agentic-operations-4jim19l0i-cheela-akhils-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: orion-postgres
          property: connectionString

databases:
  - name: orion-postgres
    region: oregon
    plan: free
    databaseName: orion
    user: orion
